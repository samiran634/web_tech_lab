<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Find Largest Number</title> 
    <link rel="stylesheet" href="style.css">
</head> 
<body> 
 
    <div class="overlay">
        <div class="mainContainer">
            <h2>Find the Largest of Three Numbers</h2> 
     
    <form id="numberForm"> 
        <label for="num1">Number 1:</label> 
        <input type="number" id="num1" required><br> 
 
        <label for="num2">Number 2:</label> 
        <input type="number" id="num2" required><br> 
 
        <label for="num3">Number 3:</label> 
        <input type="number" id="num3" required><br> 
 
        <button type="submit" class="button">Find Largest</button> 
    </form> 
 
    <div id="result"></div> 
        </div>
    </div>
    
 
    <script> 
        const form = document.getElementById('numberForm'); 
        const resultDiv = document.getElementById('result'); 
 
        form.addEventListener('submit', function(event) { 
            event.preventDefault(); 
            const num1 = parseFloat(document.getElementById('num1').value); 
            const num2 = parseFloat(document.getElementById('num2').value); 
            const num3 = parseFloat(document.getElementById('num3').value); 
            if (isNaN(num1) || isNaN(num2) || isNaN(num3)) { 
                resultDiv.innerHTML = '<span class="error">Please enter valid numbers for all fields.</span>'; 
                return; 
            } 
            const largest = Math.max(num1, num2, num3); 
            resultDiv.innerHTML = `The largest number is: ${largest}`; 
        }); 
    </script> 
 
</body> 
</html>
