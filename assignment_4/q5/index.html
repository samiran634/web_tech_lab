<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ondemand stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="overlay">
            <div class="mainContainer">
                <div class="timeShowCase">
                    <div class="hour"></div>
                    <div class="minits"></div>
                    <div class="secs"></div>
                </div>
                <div class="buttons">
                    <button class="button" id="start">
                        Start
                    </button>
                    <button class="button" id="stop">
                        Stop
                    </button>
                   
                    <button class="button" id="restart">
                        Restart
                    </button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
</body>
</html>
