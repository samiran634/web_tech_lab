<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnDemandWordCounter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay">
        <div class="mainContainer">
            <div class="wordsInput">
                <input type="text" placeholder="past small paragraphs and count there words" id="inputBox" class="large-input-box"/>

            </div>
            <div class="wordsDisplay">
                Please input some words.
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
